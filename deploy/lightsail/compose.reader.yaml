# Optional shared-Caddy deployment only. No host ports and no provider keys here.
services:
  tryon:
    environment:
      TRYON_LINK_BROWSER: "1"
      TRYON_READER_URL: http://link-reader:3002
      TRYON_READER_TOKEN: ${TRYON_READER_TOKEN:?Set a separate reader token of at least 32 characters}
    depends_on:
      link-reader:
        condition: service_started
  link-reader:
    build:
      context: ../..
      dockerfile: deploy/browser-reader/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      TRYON_READER_TOKEN: ${TRYON_READER_TOKEN:?Set a separate reader token of at least 32 characters}
    networks: [reader_shared]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run:size=4m,mode=755
    cap_drop: [ALL]
    # Used by the entrypoint only, then all capabilities are dropped before Node/Chromium.
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    cpus: 0.75
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  reader_shared:
    external: true
    name: beauty_studio_default
