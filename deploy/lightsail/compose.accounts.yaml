# Add this file to the existing shared-Caddy deployment with both -f flags.
# Keep the named volume across rebuilds; do not use `down -v`.
services:
  tryon:
    environment:
      TRYON_DATA_DIR: /app/data
      TRYON_FEMALE_PROFILES: ${TRYON_FEMALE_PROFILES:-false}
      TRYON_TRUST_PROXY_HOPS: "1"
      TRYON_PILOT_CREDITS: ${TRYON_PILOT_CREDITS:-1000}
      TRYON_PUBLIC_URL: ${TRYON_PUBLIC_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_STARTER: ${RAZORPAY_PLAN_STARTER:-}
      RAZORPAY_PLAN_GROWTH: ${RAZORPAY_PLAN_GROWTH:-}
      RAZORPAY_PLAN_CHAIN: ${RAZORPAY_PLAN_CHAIN:-}
      RAZORPAY_PLAN_STARTER_ANNUAL: ${RAZORPAY_PLAN_STARTER_ANNUAL:-}
      RAZORPAY_PLAN_GROWTH_ANNUAL: ${RAZORPAY_PLAN_GROWTH_ANNUAL:-}
      RAZORPAY_PLAN_CHAIN_ANNUAL: ${RAZORPAY_PLAN_CHAIN_ANNUAL:-}
      FORME_LEGAL_NAME: ${FORME_LEGAL_NAME:-}
      FORME_ADDRESS: ${FORME_ADDRESS:-}
      FORME_BILLING_EMAIL: ${FORME_BILLING_EMAIL:-}
      FORME_GSTIN: ${FORME_GSTIN:-}
      FORME_STATE_CODE: ${FORME_STATE_CODE:-}
      TRYON_ALLOW_SIGNUP: ${TRYON_ALLOW_SIGNUP:-true}
    volumes:
      - tryon_accounts:/app/data
volumes:
  tryon_accounts:
