# Optional final override, after shared/accounts/shopify. Create and review the
# host directory first; Compose must not create an empty directory silently.
services:
  tryon:
    environment:
      TRYON_SHOPPER_CONFIG_MODULE: /run/forme-shopper-config/services.mjs
      TRYON_SHOPPER_CAPTCHA: ${TRYON_SHOPPER_CAPTCHA:-}
      TRYON_TURNSTILE_SITE_KEY: ${TRYON_TURNSTILE_SITE_KEY:-}
      TRYON_TURNSTILE_SECRET_KEY: ${TRYON_TURNSTILE_SECRET_KEY:-}
    volumes:
      - type: bind
        source: ${TRYON_SHOPPER_CONFIG_DIR:?Set the existing reviewed shopper configuration directory}
        target: /run/forme-shopper-config
        read_only: true
        bind:
          create_host_path: false
